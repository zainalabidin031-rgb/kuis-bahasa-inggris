<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Bahasa Inggris Kelas 5 SD</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

.question p{
    font-weight:bold;
}

label{
    display:block;
    margin:6px 0;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2980b9;
}

#result{
    margin-top:25px;
    padding:20px;
    border-radius:8px;
    display:none;
}

.success{
    background:#d4edda;
    color:#155724;
}

.fail{
    background:#f8d7da;
    color:#721c24;
}

#retryBtn{
    display:none;
    margin-top:15px;
    background:#e67e22;
}
</style>
</head>
<body>

<div class="container">
    <h1>Kuis Bahasa Inggris Dasar Kelas 5 SD</h1>

    <form id="quizForm"></form>

    <button onclick="checkAnswers()">Selesai & Lihat Nilai</button>

    <div id="result"></div>

    <button id="retryBtn" onclick="location.reload()">Ulangi Kuis</button>
</div>

<script>

const questions = [
{
q:"1. What is the English word for 'buku'?",
o:["Pen","Book","Bag","Chair"],
a:1
},
{
q:"2. How do you say 'apel' in English?",
o:["Orange","Banana","Apple","Grape"],
a:2
},
{
q:"3. What color is the sky on a clear day?",
o:["Blue","Green","Black","Pink"],
a:0
},
{
q:"4. Which one is an animal?",
o:["Table","Cat","Book","Bag"],
a:1
},
{
q:"5. 'Good morning' means...",
o:["Selamat malam","Selamat pagi","Selamat sore","Sampai jumpa"],
a:1
},
{
q:"6. How many days are there in a week?",
o:["5","6","7","8"],
a:2
},
{
q:"7. What is the English word for 'air' (minuman)?",
o:["Milk","Juice","Water","Tea"],
a:2
},
{
q:"8. 'I ____ a student.'",
o:["am","is","are","be"],
a:0
},
{
q:"9. Which one is a fruit?",
o:["Car","Mango","Pencil","Desk"],
a:1
},
{
q:"10. What is the opposite of 'big'?",
o:["Tall","Small","Fast","Good"],
a:1
},
{
q:"11. English word for 'rumah' is...",
o:["School","House","Market","Road"],
a:1
},
{
q:"12. 'Thank you' means...",
o:["Permisi","Maaf","Terima kasih","Tolong"],
a:2
},
{
q:"13. How many months are there in a year?",
o:["10","11","12","13"],
a:2
},
{
q:"14. What is the English word for 'matahari'?",
o:["Moon","Star","Sun","Sky"],
a:2
},
{
q:"15. Which sentence is correct?",
o:["She are happy","She is happy","She am happy","She be happy"],
a:1
},
{
q:"16. What color is a banana?",
o:["Blue","Yellow","Purple","Black"],
a:1
},
{
q:"17. English word for 'sekolah' is...",
o:["School","Class","Book","Teacher"],
a:0
},
{
q:"18. 'Dog' in Indonesian is...",
o:["Kucing","Burung","Anjing","Ikan"],
a:2
},
{
q:"19. Which one is a profession?",
o:["Teacher","Table","Apple","Book"],
a:0
},
{
q:"20. What is the opposite of 'hot'?",
o:["Cold","Warm","Fast","Small"],
a:0
},
{
q:"21. 'My father is ____ doctor.'",
o:["a","an","the","am"],
a:0
},
{
q:"22. What is the English word for 'kursi'?",
o:["Chair","Table","Window","Door"],
a:0
},
{
q:"23. Which one is a day?",
o:["January","Monday","School","Morning"],
a:1
},
{
q:"24. 'See you later' means...",
o:["Selamat datang","Sampai jumpa nanti","Apa kabar","Selamat pagi"],
a:1
},
{
q:"25. What is the English word for 'ibu'?",
o:["Brother","Father","Mother","Sister"],
a:2
}
];

const form = document.getElementById("quizForm");

questions.forEach((item,index)=>{
    let div=document.createElement("div");
    div.className="question";

    let html=`<p>${item.q}</p>`;

    item.o.forEach((option,i)=>{
        html+=`
        <label>
        <input type="radio" name="q${index}" value="${i}">
        ${option}
        </label>`;
    });

    div.innerHTML=html;
    form.appendChild(div);
});

function checkAnswers(){

    let score=0;

    questions.forEach((item,index)=>{
        const answer=document.querySelector(`input[name="q${index}"]:checked`);

        if(answer && Number(answer.value)===item.a){
            score++;
        }
    });

    const nilai=Math.round((score/questions.length)*100);

    const result=document.getElementById("result");
    result.style.display="block";

    if(nilai>=80){
        result.className="success";
        result.innerHTML=`
        <h2>🎉 Selamat!</h2>
        <p>Jawaban Benar: <b>${score}</b> dari ${questions.length}</p>
        <p>Nilai Anda: <b>${nilai}</b></p>
        <p>Status: <b>LULUS</b></p>
        `;
        document.getElementById("retryBtn").style.display="none";
    }else{
        result.className="fail";
        result.innerHTML=`
        <h2>📚 Perlu Belajar Lagi</h2>
        <p>Jawaban Benar: <b>${score}</b> dari ${questions.length}</p>
        <p>Nilai Anda: <b>${nilai}</b></p>
        <p>Status: <b>BELUM LULUS</b></p>
        <p>Nilai minimal kelulusan adalah 80.</p>
        `;
        document.getElementById("retryBtn").style.display="inline-block";
    }

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}
</script>

</body>
</html>
```

File ini bisa langsung dibuka di browser tanpa memerlukan server atau database.
